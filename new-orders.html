<script>
/* ============================================================
   STATE
   ============================================================ */
let allOrders = [];
let allTechnicians = [];
let allDailyReports = [];
let ordersFirstLoadDone = false;
const _urlParams = new URLSearchParams(location.search);
let highlightOrderId = _urlParams.get('assignOrder') || null;   // ከቴሌግራም "መድብ" ቁልፍ

/* ============================================================
   ቴክኒሻን ሁኔታ / ዋርኒግ / ራንክ (admin.html ጋር ተመሳሳይ)
   ============================================================ */
const UNREPORTED_HOURS = 24; // ከዚህ ሰዓት በላይ የተመደበ ስራ ሪፖርት ካልተደረገበት ራስ-ሰር ዋርኒግ
function startOfTodayMs() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function toMs(v) {
    try {
        if (!v) return 0;
        if (v.toDate) return v.toDate().getTime();
        if (typeof v.seconds === 'number') return v.seconds * 1000;
        const t = new Date(v).getTime();
        return isNaN(t) ? 0 : t;
    } catch (e) { return 0; }
}
function techUnreportedCount(tech) {
    const lim = Date.now() - UNREPORTED_HOURS * 3600 * 1000;
    return allOrders.filter(o => o.technician === tech.name && o.status === 'Assigned' && toMs(o.assignedAt) > 0 && toMs(o.assignedAt) < lim).length;
}
/** { reasons:[...], manual:bool, auto:bool } ወይም null */
function techWarning(tech) {
    const reasons = [];
    const manual = !!(tech.warning && tech.warning.active);
    if (manual) reasons.push(tech.warning.reason || 'በአድሚን ዋርኒግ ተሰጥቷል');
    const n = techUnreportedCount(tech);
    if (n > 0) reasons.push(`${n} ስራ ሪፖርት አልተደረገም (ከ${UNREPORTED_HOURS} ሰዓት በላይ)`);
    return reasons.length ? { reasons, manual, auto: n > 0 } : null;
}
function techNotTodayToday(tech) {
    const lim = startOfTodayMs();
    return allOrders.some(o => o.technician === tech.name && o.status === 'NotToday' && toMs(o.completedAt) >= lim);
}
function techIsOffline(t) { return t.isOnline !== true || t.status === 'off-duty'; }
/** 🔴 በስራ ላይ ያለ ቴክኒሻን ክፍት (Assigned) ስራዎች ብዛት */
function techOpenAssignedCount(t) {
    return allOrders.filter(o => o.status === 'Assigned' && (o.technicianId ? o.technicianId === t.id : o.technician === t.name)).length;
}
/** 'busy' (🔴 በስራ ላይ) | 'off' (⚪ «ዛሬ አልወጣሁም» ያለ) | 'free' (🟢 ከሁለቱ ውጪ ሁሉ — «ነጻ ነኝ» ባይልክም) */
function techWorkState(t) {
    if (t.status === 'working' || techOpenAssignedCount(t) > 0) return 'busy';
    if (t.status === 'off-duty') return 'off';
    return 'free';
}
/* ============================================================
   🏅 የቴክኒሻን ራንክ — 50% ባስገባው ገቢ + 50% ጠቅላላ የስራ አፈጻጸም (ባለፉት 30 ቀናት ሪፖርቶች)
     • ገቢ ነጥብ  = የቴክኒሻኑ ገቢ ÷ ከሁሉም ከፍተኛው ገቢ
     • አፈጻጸም   = የተሰሩ ስራዎች ÷ (የተሰሩ + ያልተሰሩ)
     • ጠቅላላ    = 50% × ገቢ ነጥብ + 50% × አፈጻጸም  (0–100%)
   ሪፖርት ያላስገባ ቴክኒሻን ራንክ አይሰጠውም።
   ============================================================ */
const TECH_RANK_DAYS = 30;
function techRankMap() {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - TECH_RANK_DAYS);
    const ck = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
    const acc = new Map();
    (allDailyReports || []).forEach(r => {
        if (!r.dateKey || r.dateKey < ck) return;
        const t = fieldTechs().find(x => (r.technicianId && x.id === r.technicianId) || (!r.technicianId && x.name === r.technicianName));
        if (!t) return;
        const a = acc.get(t.id) || { income: 0, done: 0, total: 0, reports: 0 };
        const jobs = Array.isArray(r.jobStatuses) ? r.jobStatuses : [];
        if (jobs.length) {
            jobs.forEach(j => { const u = Math.max(1, parseInt(j && j.count, 10) || 1); a.total += u; if (j.status === 'completed') a.done += u; });
        } else {
            const d = parseFloat(r.completedCount) || 0, n = parseFloat(r.notCompletedCount) || 0;
            a.done += d; a.total += d + n;
        }
        a.income += parseFloat(r.totalIncome ?? r.income) || 0;
        a.reports += 1;
        acc.set(t.id, a);
    });
    const maxIncome = Math.max(0, ...[...acc.values()].map(a => a.income));
    const rows = [...acc.entries()].map(([id, a]) => {
        const incomeScore = maxIncome > 0 ? a.income / maxIncome : 0;
        const rate = a.total > 0 ? a.done / a.total : 0;
        return { id, income: a.income, rate, incomeScore, score: Math.round((0.5 * incomeScore + 0.5 * rate) * 1000) / 10, reports: a.reports };
    }).sort((x, y) => y.score - x.score || y.income - x.income);
    const map = new Map();
    rows.forEach((r, i) => map.set(r.id, Object.assign(r, { rank: i + 1, of: rows.length })));
    return map;
}
function techRankBadge(t, map) {
    const r = (map || techRankMap()).get(t.id);
    if (!r) return '';
    const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '🏅';
    const tip = `ራንክ ${r.rank}/${r.of} • ጠቅላላ ${r.score}% • ገቢ ${Math.round(r.incomeScore * 100)}% (${Math.round(r.income).toLocaleString()} ብር) • አፈጻጸም ${Math.round(r.rate * 100)}%`;
    return ` <span title="${tip}" style="font-size:0.72rem; font-weight:700; color:#B45309; background:#FEF3C7; border-radius:50px; padding:1px 8px; white-space:nowrap;">${medal} #${r.rank} · ${r.score}%</span>`;
}
const TECH_STATE_UI = {
    busy: { dot: '🔴', color: '#DC2626', text: 'በስራ ላይ' },
    free: { dot: '🟢', color: '#16A34A', text: 'ነጻ' },
    off:  { dot: '⚪', color: '#64748B', text: 'ዛሬ አልወጣም' }
};
function techOptionsHtml() {
    const _rk = techRankMap();
    return fieldTechs().map(t => {
        const st = techWorkState(t);
        const ui = TECH_STATE_UI[st];
        const nt = techNotTodayToday(t);
        const w = techWarning(t);
        const tags = ' (' + ui.text + ')' + (nt ? ' ⚠️ዛሬ አይመቸኝም' : '') + (w ? ' 🚩ዋርኒግ' : '');
        const addr = t.address && t.address !== '—' ? ' - ' + t.address : '';
        const rk = _rk.get(t.id);
        const rkTxt = rk ? ` 🏅#${rk.rank}·${rk.score}%` : '';
        return `<option value="${escHtml(t.name)}" style="color:${ui.color};${st === 'busy' ? 'font-weight:700;' : ''}">${ui.dot} ${escHtml(t.name)}${rkTxt}${tags}${escHtml(addr)}</option>`;
    }).join('');
}
function fieldTechs() { return allTechnicians.filter(t => !t.isPhoneOperator && !t.isOffice); } // 📞 ኦፕሬተሮች ለስራ አይመደቡም

/* ============================================================
   አዲስ ትዕዛዝ ማንቂያ (ድምጽ + toast + ትብ ብልጭታ + browser notification)
   ============================================================ */

const originalDocTitle = document.title;
let titleFlashInterval = null;

function playNewOrderBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.18].forEach((delay, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = i === 0 ? 880 : 1046.5;
            gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.16);
            osc.connect(gain).connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.18);
        });
    } catch (e) { console.warn('New-order beep failed (non-fatal):', e); }
}

function flashDocTitle(text) {
    if (titleFlashInterval) return; // already flashing
    let toggle = false;
    titleFlashInterval = setInterval(() => {
        document.title = toggle ? text : originalDocTitle;
        toggle = !toggle;
    }, 1000);
    const stop = () => {
        clearInterval(titleFlashInterval);
        titleFlashInterval = null;
        document.title = originalDocTitle;
        window.removeEventListener('focus', stop);
    };
    window.addEventListener('focus', stop);
}

function notifyNewOrder(order) {
    // 1) ድምጽ
    playNewOrderBeep();
    // 2) Toast
    showToast(`🆕 አዲስ ትዕዛዝ ደረሰ፦ ${order.fullName || 'ደንበኛ'} — ${order.appliance || ''}`, 'success');
    // 3) ትብ (tab) ርዕስ ብልጭ ድርግም ካልታየ (ሌላ tab ላይ ከሆነ)
    if (document.hidden) flashDocTitle('🆕 አዲስ ትዕዛዝ ደረሰ!');
    // 4) Browser system notification (ፍቃድ ካለ)
    try {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('🆕 አዲስ ትዕዛዝ ደረሰ', {
                body: `${order.fullName || 'ደንበኛ'} — ${order.appliance || ''} — ${order.address || ''}`,
                icon: 'icon-192.png'
            });
        }
    } catch (e) { console.warn('Notification popup failed (non-fatal):', e); }
}
function enableNotifications() {
    if (!('Notification' in window)) { showToast('ይህ browser ማሳወቂያ አይደግፍም', 'error'); return; }
    Notification.requestPermission().then(p => {
        showToast(p === 'granted' ? '✅ ማሳወቂያ ተፈቅዷል' : '⚠️ ማሳወቂያ አልተፈቀደም', p === 'granted' ? 'success' : 'error');
        const b = document.getElementById('notifyBtn'); if (b && p === 'granted') b.style.display = 'none';
    });
}

/* ============================================================
   ምንጭ (ደንበኛ ገጽ / ስልክ / ሾፕ)
   ============================================================ */
const SRC_META = {
    web:   { label: '🌐 ከደንበኛ ገጽ', short: 'ደንበኛ ገጽ' },
    phone: { label: '📞 በስልክ',       short: 'ስልክ' },
    shop:  { label: '🏪 ከሾፕ',        short: 'ሾፕ' }
};
function orderSource(o) {
    if (o.source === 'phone_admin') return 'phone';
    if (o.source === 'shop_admin') return 'shop';
    return 'web';
}
function srcLabel(o) {
    const k = orderSource(o);
    const by = (k !== 'web' && o.createdByName) ? ' · ' + String(o.createdByName).replace(/</g, '&lt;') : '';
    return SRC_META[k].label + by;
}

/* ============================================================
   ምደባ / ምክር / ስረዛ (admin.html ውስጥ ካለው ጋር ተመሳሳይ)
   ============================================================ */
function recommendTechnician(orderId) {
    const activeTechs = fieldTechs().filter(t => !t.status || t.status === 'active');
    if (activeTechs.length === 0) {
        showToast('ንቁ ቴክኒሻን አልተገኘም / No active technician found', 'error');
        return;
    }

    // Count open jobs (Pending/Assigned) currently on each technician
    const load = {};
    activeTechs.forEach(t => load[t.name] = 0);
    allOrders.forEach(o => {
        if (o.status === 'Assigned' && o.technician && load.hasOwnProperty(o.technician)) {
            load[o.technician]++;
        }
    });

    // Pick the technician with the fewest open jobs (round-robin on ties)
    let best = activeTechs[0].name;
    let bestLoad = load[best];
    activeTechs.forEach(t => {
        if (load[t.name] < bestLoad) {
            best = t.name;
            bestLoad = load[t.name];
        }
    });

    const select = document.querySelector(`.dashAssignSelect[data-id="${orderId}"]`);
    if (select) {
        select.value = best;
        select.style.borderColor = 'var(--success)';
        select.style.background = '#F0FDF4';
    }
    showToast(`🤖 ተመክሯል፡ ${best} (አሁን ${bestLoad} ክፍት ስራ አለው) — "ምድብ" ተጫን ለማረጋገጥ`, 'success');
}

async function assignOrder(orderId) {
    // ✅ NEW: ከ Dashboard ላይ ካለው quick-assign select ወይም ከ Orders ትር ላይ ካለው select ይነበብ
    const dashSelect = document.querySelector(`.dashAssignSelect[data-id="${orderId}"]`);
    const ordersSelect = document.querySelector(`.assignSelect[data-id="${orderId}"]`);
    const select = (dashSelect && dashSelect.value) ? dashSelect : ordersSelect;
    let techName = select ? select.value.trim() : '';

    if (!techName) {
        showToast('እባክዎ ቴክኒሻን ይምረጡ / Please select a technician', 'error');
        return;
    }

    // Validate that the technician exists in the staff list
    const techExists = allTechnicians.some(t => t.name === techName);
    if (!techExists) {
        showToast(`ይህ ቴክኒሻን (${techName}) የለም / Technician not found`, 'error');
        return;
    }

    // ⚠️ ኦፍላይን / "ዛሬ አይመቸኝም" ያለ / ዋርኒግ ያለበት ከሆነ ከመመደብ በፊት ያስጠነቅቃል
    const _selTech = allTechnicians.find(t => t.name === techName);
    if (_selTech) {
        const _warns = [];
        if (techWorkState(_selTech) === 'busy') _warns.push('🔴 አሁን በስራ ላይ ነው (ክፍት ስራ አለው)');
        else if (_selTech.status === 'off-duty') _warns.push('⚪ «ዛሬ አልወጣሁም» ብሏል');
        else if (techIsOffline(_selTech)) _warns.push('📴 ኦንላይን አይደለም');
        if (techNotTodayToday(_selTech)) _warns.push('⚠️ ዛሬ "አይመቸኝም" ብሎ ልኳል');
        const _w = techWarning(_selTech);
        if (_w) _warns.push('🚩 ዋርኒግ: ' + _w.reasons.join('፣ '));
        if (_warns.length && !confirm(`${techName}\n${_warns.join('\n')}\n\nቢሆንም ይመድቡት?`)) return;
    }

    try {
        await db.collection('orders').doc(orderId).update({
            status: 'Assigned',
            technician: techName,  // store exact name
            assignedAt: new Date(),
            assignedBy: (heGetSession().staff.role === 'admin' ? 'admin' : 'office')
        });

        await db.collection('activity').add({
            user: heUserName(),
            action: 'assign_order',
            details: `ትዕዛዝ #${orderId.substring(0,8)} ለ ${techName} ተመድቧል`,
            timestamp: new Date()
        });

        const orderSnap = await db.collection('orders').doc(orderId).get();
        const order = orderSnap.data();

        // ✅ FIX: ማሳወቂያው ወደ አድሚን group ሳይሆን ቀጥታ ለ ተመደበው ቴክኒሻን ራሱ ይላካል
        const assignedTech = allTechnicians.find(t => t.name === techName);
        // ✅ NEW: ደንበኛው ቦታውን ፒን አድርጎ ከሆነ የናቪጌሽን ሊንክ በመልእክቱ ውስጥ ይካተት
        const hasOrderLocation = order.customerLat && order.customerLng;
        const locationLine = hasOrderLocation
            ? `📍 *ካርታ ላይ ይመልከቱ:* https://www.google.com/maps/dir/?api=1&destination=${order.customerLat},${order.customerLng}\n`
            : '';

        const jobMessage = `
📋 *አዲስ ስራ ተመድቦልዎታል!* 🛠️

🆔 *ትዕዛዝ:* #${orderId.substring(0,8)}
👤 *ደንበኛ:* ${order.fullName || '—'}
📱 *ስልክ:* ${order.phone || '—'}
🔧 *መሳሪያ:* ${order.appliance || '—'}
📍 *አድራሻ:* ${order.address || '—'}
${locationLine}
⏰ ${formatEthDateTime(new Date())}
        `;

        // ✅ FIX: ስራ ሲመደብ ትዕዛዙ ለ ተመደበው ቴክኒሻን ብቻ ይተላለፍ - ወደ አድሚን group
        // ብሮድካስት አይላክም (አድሚኖች ራሳቸው ዳሽቦርዱ ላይ real-time listener ስላላቸው
        // ቀድሞውኑ ያውቃሉ፣ ስለዚህ ለሁሉም መላክ አያስፈልግም)
        if (assignedTech && assignedTech.chatId) {
            await sendTelegramNotification(jobMessage, assignedTech.chatId);
        } else {
            showToast(`⚠️ የ ${techName} Telegram አልተገናኘም - መልእክት በቴሌግራም አልደረሰውም (push/ዳሽቦርድ ላይ ብቻ ያያል)`, 'error');
        }

        // ✅ NEW: ከቴሌግራም/ፑሽ በተጨማሪ ወይም ቴክኒሻኑ ቴሌግራም ባይገናኝም ስራው
        // ሁልጊዜ በ SMS text ወደ ስልኩ ይድርሰው (ኢንተርኔት ባይኖረውም እንኳ ይደርሰዋል)
        const smsMessage = `Halal Electronics: አዲስ ስራ ተመድቦልዎታል! ደንበኛ: ${order.fullName || '—'} ስልክ: ${order.phone || '—'} መሳሪያ: ${order.appliance || '—'} አድራሻ: ${order.address || '—'}`;
        if (assignedTech && assignedTech.phone) {
            await sendSmsNotification(smsMessage, assignedTech.phone);
        }

        // ✅ Push notification (FCM) queue - handled by the 5-min notify job
        if (assignedTech && assignedTech.id) {
            await db.collection('pushQueue').add({
                toStaffId: assignedTech.id,
                title: '📋 አዲስ ስራ ተመድቦልዎታል',
                body: `${order.appliance || 'ስራ'} - ${order.fullName || ''} (${order.address || ''})`,
                // ✅ NEW: ቦታው ካለ ወደ ናቪጌሽን የሚወስድ ሊንክ ከፑሽ ማሳወቂያው ጋር ይላክ
                locationUrl: hasOrderLocation ? `https://www.google.com/maps/dir/?api=1&destination=${order.customerLat},${order.customerLng}` : null,
                createdAt: Date.now(),
                sent: false
            });
        }

        showToast(`✅ ስራው ለ ${techName} ተመድቧል / Assigned to ${techName}`, 'success');
        
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
        console.error('Assignment error:', error);
    }
}

async function deleteOrder(orderId) {
    if (!confirm('ይህን ትዕዛዝ መሰረዝ እርግጠኛ ነዎት?')) return;
    try {
        await db.collection('orders').doc(orderId).delete();
        await db.collection('activity').add({
            user: heUserName(),
            action: 'delete_order',
            details: `ትዕዛዝ #${orderId.substring(0,8)} ተሰርዟል`,
            timestamp: new Date()
        });
        showToast('✅ ትዕዛዝ ተሰርዟል', 'success');
    } catch (error) {
        showToast('❌ ' + error.message, 'error');
    }
}

        ${row('❓ ችግር', escHtml(o.problem || '—'))}
        ${row('📅 የተፈለገ ቀን', escHtml(o.preferredDay || '—'))}

        ${o.foundUs ? row('📣 እኛን ያገኙት', escHtml(o.foundUs + (o.foundUsText ? ' - ' + o.foundUsText : ''))) : ''}

/* ✍️ ከኦፕሬተር የተጻፈ መልእክት */
function operatorNotesHtml(o) {
    const notes = Array.isArray(o.operatorNotes) ? o.operatorNotes : [];
    if (!notes.length) return '';
    return `<div class="op-note"><strong>✍️ ከኦፕሬተር መልእክት:</strong>${notes.map(n => `<div>💬 ${escHtml(n.text || '')} <small>— ${escHtml(n.by || '')}</small></div>`).join('')}</div>`;
}

   📊 የካርዶች ዝርዝር (ገና ያልተመደቡ / የተመደቡ ክፍት ስራዎች / ነጻ ቴክኒሻኖች)
   ============================================================ */
function showStatDetail(kind) {
    let title = '', body = '';
    const orderItem = o => {
        const d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : null;
        return `<div class="sd-item">
            <div style="font-weight:600;">${escHtml(o.fullName || '—')} <span class="text-muted" style="font-weight:400;">• ${escHtml(o.appliance || '—')}</span></div>
            <div class="text-muted" style="font-size:.78rem;">📱 ${o.phone ? `<a href="tel:${escHtml(o.phone)}">${escHtml(o.phone)}</a>` : '—'} &nbsp; 📍 ${escHtml(o.address || '—')}${d ? ' &nbsp; 🕒 ' + formatEthDateTime(d) : ''}</div>
            ${o.technician ? `<div style="font-size:.8rem;margin-top:2px;">👨‍🔧 <b>${escHtml(o.technician)}</b></div>` : ''}
            ${o.preferredDay ? `<div style="font-size:.78rem;color:var(--primary);">📅 ${escHtml(o.preferredDay)}</div>` : ''}
            ${operatorNotesHtml(o)}
        </div>`;
    };
    if (kind === 'pending') {
        title = '⏳ ገና ያልተመደቡ';
        const l = allOrders.filter(o => o.status === 'Pending').sort((a, b) => toMs(b.createdAt) - toMs(a.createdAt));
        body = l.length ? l.map(orderItem).join('') : '<p class="text-muted text-center">ምንም የለም</p>';
    } else if (kind === 'assigned') {
        title = '📋 የተመደቡ ክፍት ስራዎች';
        const l = allOrders.filter(o => o.status === 'Assigned').sort((a, b) => toMs(b.assignedAt || b.createdAt) - toMs(a.assignedAt || a.createdAt));
        body = l.length ? l.map(orderItem).join('') : '<p class="text-muted text-center">ምንም የለም</p>';
    } else {
        title = '🟢 ነጻ ቴክኒሻኖች';
        const l = fieldTechs().filter(t => techWorkState(t) === 'free');
        body = l.length ? l.map(t => `<div class="sd-item"><div style="font-weight:600;">👨‍🔧 ${escHtml(t.name || '—')}</div>
            <div class="text-muted" style="font-size:.78rem;">${t.phone ? '📱 <a href="tel:' + escHtml(t.phone) + '">' + escHtml(t.phone) + '</a>' : ''}${techIsOffline(t) ? ' &nbsp; ⚪ ከመስመር ውጪ' : ' &nbsp; 🟢 መስመር ላይ'}</div></div>`).join('') : '<p class="text-muted text-center">ነጻ ቴክኒሻን የለም</p>';
    }
    openModal(title, body);
}

function renderDashNewOrders() {

        .sort((a, b) => toMs(b.createdAt) - toMs(a.createdAt));

    document.getElementById('statAssigned').textContent = allOrders.filter(o => o.status === 'Assigned').length;
    document.getElementById('statFree').textContent = fieldTechs().filter(t => techWorkState(t) === 'free').length;

    // ማጣሪያ
    const q = (document.getElementById('orderSearch').value || '').trim().toLowerCase();
    const sf = document.getElementById('sourceFilter').value;
    const shown = pending.filter(o =>
        (sf === 'all' || orderSource(o) === sf) &&
        (!q || (o.fullName || '').toLowerCase().includes(q) || (o.phone || '').includes(q)));

    // በግማሽ የተመረጠ ቴክኒሻን እንዳይጠፋ ማስቀመጥ
    const keep = {};
    list.querySelectorAll('.dashAssignSelect').forEach(s => { if (s.value) keep[s.dataset.id] = s.value; });

    if (!shown.length) {
        list.innerHTML = `<p class="text-muted text-center">${pending.length ? 'ከፍለጋው ጋር የሚመሳሰል ትዕዛዝ የለም' : 'ምንም አዲስ ትዕዛዝ የለም'}</p>`;
        return;
    }
    const techOptions = techOptionsHtml();
    list.innerHTML = shown.map(order => {
        const date = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate() : new Date();
        const hl = order.id === highlightOrderId ? ' hl' : '';
        return `<div class="order-row${hl}" id="ord-${order.id}">
            <div class="order-info">
                <div style="font-weight:600;">${escHtml(order.fullName || '—')} <span class="text-muted" style="font-weight:400; font-size:0.8rem;">• ${escHtml(order.appliance || '—')}</span></div>
                <div class="text-muted" style="font-size:0.78rem;">📱 ${order.phone ? `<a href="tel:${escHtml(order.phone)}" style="font-weight:600;">${escHtml(order.phone)}</a>` : '—'}
                    &nbsp; <i class="fas fa-map-marker-alt"></i> ${escHtml(order.address || '—')}
                    &nbsp; <i class="fas fa-clock"></i> ${formatEthDateTime(date)}</div>
                <div style="margin-top:3px;"><span class="tag">${srcLabel(order)}</span>
                    ${order.preferredDay ? `<span class="tag" style="color:var(--primary);">📅 ${escHtml(order.preferredDay)}</span>` : ''}
                    ${order.suggestedWorkerName ? `<span class="tag" style="color:#B45309;">⭐ ${escHtml(order.suggestedWorkerName)}</span>` : ''}</div>
                ${order.returnReason ? `<div style="margin-top:4px; padding:4px 8px; border-radius:6px; background:#FEF3C7; color:#92400E; font-size:0.78rem;">↩️ <strong>ተመለሰ${order.returnedFrom ? ' ከ ' + escHtml(order.returnedFrom) : ''}</strong> — ምክንያት: ${escHtml(order.returnReason)}</div>` : ''}
                ${operatorNotesHtml(order)}
            </div>
            <div class="order-actions">
                <select class="dashAssignSelect" data-id="${order.id}"><option value="">ቴክኒሻን ምረጥ</option>${techOptions}</select>
                <button class="btn btn-xs btn-secondary" onclick="recommendTechnician('${order.id}')" title="ዝቅተኛ ስራ ያለበትን ቴክኒሻን ምከር"><i class="fas fa-robot"></i></button>
                <button class="btn btn-sm btn-success" onclick="assignOrder('${order.id}')"><i class="fas fa-check"></i> መድብ</button>
                <button class="btn btn-sm btn-primary" onclick="viewOrder('${order.id}')" title="ዝርዝር"><i class="fas fa-eye"></i></button>
                <button class="btn btn-xs btn-danger admin-only" onclick="deleteOrder('${order.id}')" title="ሰርዝ"><i class="fas fa-trash"></i></button>
            </div>
        </div>`;
    }).join('');
    list.querySelectorAll('.dashAssignSelect').forEach(s => { if (keep[s.dataset.id]) s.value = keep[s.dataset.id]; });

    if (highlightOrderId) {
        const el = document.getElementById('ord-' + highlightOrderId);
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); highlightOrderId = null; }
    }
}


/* ============================================================
   ⏳ የሚፀድቁ ሪፖርቶች (ከቴክኒሻኖች የመጡ፣ ገና ያልጸደቁ) — ማየትና ማጽደቅ

function renderPendingReports() {
    const card = document.getElementById('pendingReportsCard');
    const list = document.getElementById('pendingReportsList');
    if (!card || !list) return;
    const pending = (allDailyReports || []).filter(r => !r.approved)
        .slice().sort((a, b) => (b.dateKey || '').localeCompare(a.dateKey || ''));
    const badge = document.getElementById('pendingReportsBadge'); if (badge) badge.textContent = pending.length;
    card.style.display = pending.length ? '' : 'none';
    list.innerHTML = pending.map(r => {
        const income = r.totalIncome != null ? r.totalIncome : (r.income || 0);
        const photos = ((r.warrantyPhotoURLs || []).length + (r.receiptURLs || []).length);
        return `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px;">
            <div style="flex:1; min-width:150px;">
                <strong>👤 ${escHtml(r.technicianName || r.technician || '—')}</strong>
                <div class="text-muted" style="font-size:0.8rem;">📅 ${escHtml(r.date || r.dateKey || '')} · 💰 ${escHtml(income)} ብር${photos ? ' · 📸 ' + photos : ''}</div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="viewReportDetail('${r.id}')"><i class="fas fa-eye"></i> ተመልከት</button>
            <button class="btn btn-success btn-sm" onclick="approveReportFromCard('${r.id}')"><i class="fas fa-check"></i> አጽድቅ</button>
        </div>`;
    }).join('');
}
function approveReportFromCard(reportId) {
    const r = allDailyReports.find(x => x.id === reportId);
    if (!confirm(`የ ${r ? (r.technicianName || r.technician || '') : ''} ሪፖርት (${r ? (r.date || r.dateKey || '') : ''}) ይጽደቅ?`)) return;
    approveReport(reportId, r ? r.technicianId : null);
}
async function approveReport(reportId, techId) {
    try {
        const report = allDailyReports.find(r => r.id === reportId);
        if (!techId && report) techId = report.technicianId;
        await db.collection('dailyReports').doc(reportId).update({ approved: true, approvedAt: new Date() });
        if (techId) { try { await db.collection('staff').doc(techId).update({ lastApprovedDateKey: report ? report.dateKey : null }); } catch (e) { console.warn('lastApprovedDateKey update skipped', e); } }
        try { await db.collection('activity').add({ user: heUserName(), action: 'approve_report', details: `የ ${report ? report.technicianName : ''} ሪፖርት ጸደቀ (${report ? report.dateKey : ''})`, timestamp: new Date() }); } catch (e) {}
        showToast('✅ ሪፖርት ጸድቋል!', 'success');
        closeModal();
    } catch (error) { showToast('❌ ' + error.message, 'error'); }
}
function viewReportDetail(reportId) {
    const r = allDailyReports.find(x => x.id === reportId);
    if (!r) return;
    const n = (v) => (v == null || v === '') ? '—' : escHtml(v);
    const jobs = (r.jobStatuses || []).map((j, i) =>
        `<div style="font-size:0.85rem;">${i + 1}. ${escHtml(j.customer || '—')} — ${j.status === 'completed' ? '✅ ተሰርቷል' : '❌ አልተሰራም' + (j.reason ? ' (' + escHtml(j.reason) + ')' : '')}</div>`).join('');
    const gallery = (urls, label) => (urls && urls.length)
        ? `<div class="text-muted" style="font-size:0.8rem; margin-top:10px;">${label}</div><div class="photo-gallery">${urls.map(u => `<img src="${escHtml(u)}" alt="" onclick="window.open(this.src,'_blank')" />`).join('')}</div>` : '';
    const html = `
        <div style="font-size:0.9rem; line-height:1.7;">
            <div><strong>👤 ${n(r.technicianName || r.technician)}</strong> · 📅 ${n(r.date || r.dateKey)} ${r.day ? '(' + escHtml(r.day) + ')' : ''}</div>
            <div>📊 የተላኩ: ${n(r.totalSent != null ? r.totalSent : r.jobs)} | ተጠናቀቁ: ${n(r.completedCount)} | አልተጠናቀቁ: ${n(r.notCompletedCount)}</div>
            ${jobs ? `<div style="margin:8px 0; padding:8px; background:var(--bg); border-radius:8px;">${jobs}</div>` : ''}
            <div>💰 ገቢ: ${n(r.totalIncome != null ? r.totalIncome : r.income)} ብር | ወጪ: ${n(r.totalExpense)} ብር | ትርፍ: ${n(r.profit)} ብር</div>
            <div>📊 ድርሻ: ${n(r.techSharePercent)}% (ባለሙያ ${n(r.techShareAmount)} | ድርጅት ${n(r.companyAmount)})</div>
            <div>🏦 የተቀማጭ: ${n(r.deposited)} ብር</div>
            ${r.expenseDetails ? `<div>🧾 ወጪ: ${escHtml(r.expenseDetails)}</div>` : ''}
            <div>📝 ${n(r.remarks || r.notes)}</div>
            ${r.readyTomorrow ? `<div>✅ ለነገ ዝግጁ: ${r.readyTomorrow === 'yes' ? 'አዎ' : 'አይ'}</div>` : ''}
            ${gallery(r.warrantyPhotoURLs, '📸 ዋራንቲ ካርድ')}
            ${gallery(r.receiptURLs, '🏦 የባንክ ደረሰኝ')}
        </div>`;
    const footer = r.approved
        ? '<button class="btn btn-secondary" onclick="closeModal()">ዝጋ</button>'
        : `<button class="btn btn-success" onclick="approveReport('${r.id}','${escHtml(r.technicianId || '')}')"><i class="fas fa-check"></i> አጽድቅ</button> <button class="btn btn-secondary" onclick="closeModal()">ዝጋ</button>`;
    openModal('📋 የሪፖርት ዝርዝር', html, footer);
}

/* ============================================================
   ዳታ መጫን (real-time)
   ============================================================ */
function loadOrders() {
    // ያልተመደቡ + ክፍት ስራ ብቻ (የቴክኒሻን ሁኔታ ለማወቅ) — ሙሉ ታሪክ አይጫንም
    db.collection('orders').where('status', 'in', ['Pending', 'Assigned', 'NotToday']).onSnapshot((snapshot) => {
        allOrders = [];
        snapshot.forEach(doc => { const d = doc.data(); d.id = doc.id; allOrders.push(d); });
        if (ordersFirstLoadDone) {
            snapshot.docChanges().forEach(change => {
                if (change.type === 'added' && change.doc.data().status === 'Pending') notifyNewOrder(change.doc.data());
            });
        } else { ordersFirstLoadDone = true; }
        renderDashNewOrders();
    }, (e) => { console.warn('orders listener', e); showToast('❌ ትዕዛዞችን መጫን አልተቻለም: ' + e.message, 'error'); });
}
function loadTechnicians() {
    db.collection('staff').onSnapshot((snapshot) => {
        allTechnicians = [];
        snapshot.forEach(doc => {
            const d = doc.data(); d.id = doc.id;
            if (d.status !== 'pending' && d.role !== 'admin' && d.status !== 'rejected' && d.isPhoneOperator !== true && !(Array.isArray(d.pages) && d.pages.length)) allTechnicians.push(d); // 🧭 ዘርፍ የተመደበለት ከቴክኒሻን ዝርዝር ውጭ
        });
        renderDashNewOrders();
    }, (e) => console.warn('staff listener', e));
}
function loadDailyReports() {
    // ለራንክ — ባለፉት 30 ቀናት ብቻ
    const c = new Date(); c.setDate(c.getDate() - TECH_RANK_DAYS);
    db.collection('dailyReports').where('dateKey', '>=', getDateKey(c)).onSnapshot((snapshot) => {
        allDailyReports = [];
        snapshot.forEach(doc => { const d = doc.data(); d.id = doc.id; allDailyReports.push(d); });
        renderDashNewOrders();
        renderPendingReports();
    }, (e) => console.warn('dailyReports listener', e));
}

HE.boot(() => {
    try { if ('Notification' in window && Notification.permission === 'granted') document.getElementById('notifyBtn').style.display = 'none'; } catch (e) {}
    document.getElementById('orderSearch').addEventListener('input', renderDashNewOrders);
    document.getElementById('sourceFilter').addEventListener('change', renderDashNewOrders);
    loadOrders();
    loadTechnicians();
    loadDailyReports();
}, { title: 'አዲስ ትዕዛዞች — የአድሚን መግቢያ', page: 'newOrders' });
</script>
